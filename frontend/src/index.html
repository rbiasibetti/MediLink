<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <title>MediLink</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Alinha o tema do Bootstrap (tabelas, selects) ao modo claro/escuro do sistema, como o resto da interface.
    (function () {
      var consulta = window.matchMedia('(prefers-color-scheme: dark)');
      var aplicar = function () {
        document.documentElement.setAttribute('data-bs-theme', consulta.matches ? 'dark' : 'light');
      };
      aplicar();
      consulta.addEventListener('change', aplicar);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
