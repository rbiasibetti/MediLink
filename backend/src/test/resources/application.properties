spring.application.name=medilink
spring.datasource.url=${MEDILINK_DB_URL}
spring.datasource.username=${MEDILINK_DB_USER}
spring.datasource.password=${MEDILINK_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
medilink.public-base-url=https://meet.medilink.test
medilink.cpf.hmac-key=chave-de-teste-nao-usar-em-producao
medilink.jitsi.app-id=medilink
medilink.jitsi.app-secret=segredo-jitsi-de-teste-com-32-ou-mais-chars
medilink.jitsi.audience=jitsi
medilink.jitsi.xmpp-domain=meet.jitsi
medilink.jitsi.token-ttl=PT2H
spring.mail.host=localhost
medilink.mail.from=teste@medilink.test
management.health.mail.enabled=false
medilink.sink.token=token-do-sink-de-teste-com-mais-de-32-caracteres
medilink.sink.dir=${java.io.tmpdir}/medilink-audio-teste
spring.kafka.bootstrap-servers=${MEDILINK_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=6000
medilink.transcricao.agendador-ativo=false
medilink.transcricao.consumidor-ativo=false
medilink.crypto.chave=dGVzdGUtdGVzdGUtdGVzdGUtdGVzdGUtdGVzdGUtMTI=
medilink.crypto.chave-id=kt
medilink.retencao.ativa=false
# O KafkaAdmin não deve esperar o broker em todo teste; o teste dos tópicos liga de novo.
spring.kafka.admin.auto-create=false
medilink.crypto.aceitar-texto-legado=true
# T17: nos testes, sem janela de tolerância (o job é publicado logo) e sem a rotina de inatividade; os testes de reabertura ligam.
medilink.consulta.tolerancia-reabertura=0s
medilink.consulta.verificar-inatividade=false
medilink.webhook.ativo=false
