spring.application.name=medilink

# SQL Server 2019+. A conexão vem do ambiente (veja config/local.env.example); sem valor padrão de senha.
spring.datasource.url=${MEDILINK_DB_URL}
spring.datasource.username=${MEDILINK_DB_USER}
spring.datasource.password=${MEDILINK_DB_PASSWORD}
# Valida o mapeamento JPA contra o schema criado pelo Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Base do link enviado ao paciente (frontend Angular).
medilink.public-base-url=${MEDILINK_PUBLIC_BASE_URL:http://localhost:4200}

# Segredo do HMAC do CPF. Obrigatório, sem valor padrão: a aplicação não sobe sem ele.
medilink.cpf.hmac-key=${MEDILINK_CPF_HMAC_KEY}

# Nunca logar corpo de requisições (contêm CPF).
logging.level.org.springframework.web=INFO

# JWT do Jitsi (T02): precisa casar com infra/jitsi/.env. O segredo é obrigatório, sem valor padrão.
medilink.jitsi.app-id=${MEDILINK_JITSI_APP_ID:medilink}
medilink.jitsi.app-secret=${MEDILINK_JITSI_APP_SECRET}
medilink.jitsi.audience=${MEDILINK_JITSI_AUDIENCE:jitsi}
medilink.jitsi.xmpp-domain=${MEDILINK_JITSI_XMPP_DOMAIN:meet.jitsi}
medilink.jitsi.token-ttl=PT2H

# E-mail do link (T05). O relay definitivo é decisão aberta (docs/plan.md); em dev use infra/dev/smtp_sink.py.
spring.mail.host=${MEDILINK_MAIL_HOST:localhost}
spring.mail.port=${MEDILINK_MAIL_PORT:1025}
spring.mail.username=${MEDILINK_MAIL_USER:}
spring.mail.password=${MEDILINK_MAIL_PASSWORD:}
medilink.mail.from=${MEDILINK_MAIL_FROM:no-reply@medilink.local}
# Queda do relay SMTP não deve tirar a aplicação do ar (readiness); o envio falha de forma isolada (502 + auditoria).
management.health.mail.enabled=false

# Audio sink (T11): segredo que o Jicofo envia no handshake (SINK_TOKEN do Jitsi) e pasta dos arquivos
# transitórios (deve ser cifrada em repouso: T14). O segredo é obrigatório, sem valor padrão.
medilink.sink.token=${MEDILINK_SINK_TOKEN}
medilink.sink.dir=${MEDILINK_SINK_DIR:${java.io.tmpdir}/medilink-audio}

# Fila de transcrição (T12): Redpanda em desenvolvimento, Kafka em produção (mesma API).
spring.kafka.bootstrap-servers=${MEDILINK_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=9000
medilink.transcricao.topico-jobs=medilink.transcricao.jobs
medilink.transcricao.topico-resultados=medilink.transcricao.resultados

# Resultados do worker (T13): lidos sem perder nenhum (earliest) e com o offset confirmado só depois de gravar.
spring.kafka.consumer.group-id=medilink-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Cifra em repouso (T14): chave mestra AES-256 em Base64, obrigatória e sem valor padrão (use um cofre em produção).
# Para rotacionar: nova chave em MEDILINK_DATA_KEY com novo MEDILINK_DATA_KEY_ID; a antiga vai em
# medilink.crypto.chaves-anteriores.<id>=<base64> enquanto houver dado cifrado com ela.
medilink.crypto.chave=${MEDILINK_DATA_KEY}
medilink.crypto.chave-id=${MEDILINK_DATA_KEY_ID:k1}

# Os tópicos nascem com retenção curta (T14) e o prazo é reajustado na subida nos que já existiam.
medilink.transcricao.retencao-dos-topicos=24h

# Retenção (T14): prazos de partida; a decisão final é do jurídico. Transcrição zerada = guardar.
medilink.retencao.tentativa-cpf=24h
medilink.retencao.audio-maximo=7d
medilink.retencao.transcricao=0s

# Administração (T18). O primeiro administrador é criado a partir destas variáveis quando ainda não existe nenhum
# (sem valor padrão: em produção a senha vem do ambiente; o TOTP é cadastrado no primeiro login).
medilink.admin.bootstrap-email=${MEDILINK_ADMIN_EMAIL:}
medilink.admin.bootstrap-senha=${MEDILINK_ADMIN_SENHA:}

# Webhook de devolução (T19). modo-dev (HTTP e endereços locais) só em desenvolvimento: o perfil prod recusa subir com ele.
medilink.webhook.modo-dev=false
