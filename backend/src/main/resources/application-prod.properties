# Produção: mesma conexão do ambiente (MEDILINK_DB_*), e o schema pertence ao Flyway.
spring.jpa.hibernate.ddl-auto=none

# Tráfego interno cifrado (T14). A subida em prod FALHA se algo abaixo não estiver ativo (config/ExigenciasDeProducao).
# Banco: use na MEDILINK_DB_URL encrypt=true;trustServerCertificate=false (certificado verificado pela JVM).
# HTTPS e WSS (o Jicofo precisa usar wss:// no url-template do audio sink, com a CA do backend no truststore do Jicofo).
server.ssl.enabled=true
server.ssl.key-store=${MEDILINK_TLS_KEYSTORE}
server.ssl.key-store-password=${MEDILINK_TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
# Fila: TLS até o broker (e ACL por usuário, a cargo da operação).
spring.kafka.security.protocol=SSL
spring.kafka.ssl.trust-store-location=${MEDILINK_KAFKA_TRUSTSTORE}
spring.kafka.ssl.trust-store-password=${MEDILINK_KAFKA_TRUSTSTORE_PASSWORD}
# Nada de texto sem cifra no banco.
medilink.crypto.aceitar-texto-legado=false
