# Incluído pelo meet.conf do Jitsi (nível do servidor), via docker-compose.override.yml.
#
# A interface do Jitsi só deve carregar dentro do iframe do MediLink. Navegadores modernos enviam
# "Sec-Fetch-Dest" em toda requisição: "document" para uma aba/URL digitada, "iframe" para um iframe e outros
# valores (script, style, empty, websocket...) para os recursos que a página carrega. Páginas e scripts não
# conseguem alterar esse cabeçalho.
#
# Limite honesto: isto esconde a interface de quem navega pelo navegador; NÃO é a fronteira de segurança.
# Um cliente que não é navegador (curl) pode omitir ou forjar o cabeçalho. Quem protege as salas é o JWT
# (Prosody, AUTH_TYPE=jwt, ENABLE_GUESTS=0): sem token válido ninguém cria nem entra em sala.

error_page 403 @acesso_direto;

location @acesso_direto {
    default_type "text/plain; charset=utf-8";
    return 403 "Acesso direto bloqueado. Use o link da sua consulta.\n";
}

if ($http_sec_fetch_dest = "document") {
    return 403;
}
